    /* THAW Aesthetic Glass & Organic Frost Styling */
    body {

    .liquid-header-wrapper {
      position: relative;
      user-select: none;
      -webkit-user-select: none;
      --mouse-x: 50%;
      --mouse-y: 50%;
      --spec-x: 50%;
      --spec-y: 38%;

    /* Telemetry Tag at Top */
    .telemetry-tag-glowing {

      color: #CBD5E1;

      color: #94A3B8;
      text-shadow: 0 0 8px rgba(148, 163, 184, 0.5);
    }

    /* Ambient Diffused Platinum Glow Layer behind text */
    .liquid-ambient-glow {
      position: absolute;
      inset: -30px;
      pointer-events: none;
      z-index: 0;
      filter: blur(44px);
      opacity: 0.5;
      overflow: visible;
      transition: opacity 0.5s ease;
    }

    .ambient-glow-blob {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      will-change: transform;
      mix-blend-mode: screen;
    }

    #glow-blob-1 {
      width: 320px;
      height: 180px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.22) 0%, rgba(203, 213, 225, 0.07) 45%, transparent 70%);
    }

    #glow-blob-2 {
      width: 340px;
      height: 200px;
      background: radial-gradient(circle, rgba(226, 232, 240, 0.2) 0%, rgba(148, 163, 184, 0.05) 50%, transparent 70%);
    }

    #glow-blob-3 {
      width: 220px;
      height: 140px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.28) 0%, rgba(241, 245, 249, 0.09) 40%, transparent 65%);
    }

    #glow-blob-4 {
      width: 260px;
      height: 160px;
      background: radial-gradient(circle, rgba(203, 213, 225, 0.2) 0%, rgba(100, 116, 139, 0.05) 50%, transparent 70%);
    }

    /* Multi-layered Liquid Masked Headline Typography */
    .liquid-headline-container {
      position: relative;
      z-index: 10;
    }

    /* Continuous Specular Shimmer / Diagonal Light Sweep Animation */
    @keyframes metallicSheenSweep {
      0% {
        background-position: -200% 0, 0 0, 0 0, 0 0;
      }
      50% {
        background-position: 250% 0, 0 0, 0 0, 0 0;
      }
      100% {
        background-position: 250% 0, 0 0, 0 0, 0 0;
      }
    }

    /* The Main Liquid Chrome / Polished Silver Text Element */
    .liquid-chrome-text,
    .liquid-fill-text {
      background-image:
        /* Layer 1: Diagonal Light Sweep Shimmer Beam */
        linear-gradient(
          115deg,
          transparent 0%,
          transparent 38%,
          rgba(255, 255, 255, 0.45) 47%,
          rgba(255, 255, 255, 0.95) 50%,
          rgba(255, 255, 255, 0.45) 53%,
          transparent 62%,
          transparent 100%
        ),
        /* Layer 2: Interactive Specular Highlight 1 (Cursor-reactive) */
        radial-gradient(
          ellipse 380px 190px at var(--spec-x, 50%) var(--spec-y, 38%),
          #FFFFFF 0%,
          rgba(248, 250, 252, 0.95) 20%,
          rgba(226, 232, 240, 0.5) 45%,
          rgba(203, 213, 225, 0.15) 65%,
          transparent 78%
        ),
        /* Layer 3: Interactive Specular Highlight 2 (Studio horizon reflection) */
        radial-gradient(
          ellipse 300px 150px at var(--spec2-x, 35%) var(--spec2-y, 65%),
          rgba(255, 255, 255, 0.8) 0%,
          rgba(241, 245, 249, 0.5) 30%,
          rgba(148, 163, 184, 0.2) 60%,
          transparent 75%
        ),
        /* Layer 4: Multi-stop Polished Liquid Chrome & Silver Metallic Base */
        linear-gradient(
          calc(120deg + var(--spec-rot, 0deg)),
          #1E293B 0%,
          #334155 8%,
          #64748B 18%,
          #CBD5E1 28%,
          #FFFFFF 38%,
          #F1F5F9 45%,
          #94A3B8 52%,
          #475569 62%,
          #CBD5E1 72%,
          #FFFFFF 82%,
          #E2E8F0 90%,
          #334155 100%
        );
      background-size: 260% 100%, 100% 100%, 100% 100%, 100% 100%;
      background-repeat: no-repeat;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      will-change: background-position, filter;
      filter: drop-shadow(0 0 18px rgba(255, 255, 255, 0.15)) drop-shadow(0 2px 4px rgba(0, 0, 0, 0.8));
      display: inline-block;
      animation: metallicSheenSweep 9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* Editorial Headline Line 1 */
    .headline-line-1 {
      font-family: 'Bodoni Moda', 'Playfair Display', 'Cinzel', serif;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 0.94;
    }

    /* Editorial Headline Line 2 */
    .headline-line-2 {
      font-family: 'Bodoni Moda', 'Playfair Display', 'Cinzel', serif;
      font-weight: 800;
      letter-spacing: 0.03em;
      line-height: 1.05;
    }

    /* '&' Italic Display Serif in Pale Ice-Silver with Specular Tint */
    .headline-ampersand {
      font-family: 'Instrument Serif', 'Playfair Display', serif;
      font-style: italic;
      font-weight: 400;
      color: #E0F2FE;
      -webkit-text-fill-color: #E0F2FE;
      text-shadow: 0 0 16px rgba(224, 242, 254, 0.6), 0 0 28px rgba(255, 255, 255, 0.25);
      margin-right: 0.08em;
      display: inline-block;
      transform: translateY(-2px);

    /* 'cutoff' Lowercase Italic Serif in Muted Satin Champagne/Platinum */
    .headline-cutoff {
      font-family: 'Instrument Serif', 'Playfair Display', serif;
      font-style: italic;
      font-weight: 400;
      text-transform: lowercase;
      color: #CBD5E1;
      -webkit-text-fill-color: #CBD5E1;
      text-shadow: 0 0 14px rgba(203, 213, 225, 0.35);
      margin-right: 0.18em;
      letter-spacing: -0.01em;
      display: inline-block;
    }

    /* 'CALCULATOR' Uppercase Display Serif */
    .headline-calculator {
      font-family: 'Bodoni Moda', 'Playfair Display', 'Cinzel', serif;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    /* Subtle frosted platinum pulse */
    @keyframes liquidSheenPulse {
      0%, 100% {
        filter: drop-shadow(0 0 18px rgba(255, 255, 255, 0.15)) drop-shadow(0 2px 4px rgba(0, 0, 0, 0.8));
      }
      50% {
        filter: drop-shadow(0 0 24px rgba(255, 255, 255, 0.28)) drop-shadow(0 2px 6px rgba(0, 0, 0, 0.85));
      }
    }

    .liquid-sheen-active {
      animation: liquidSheenPulse 7s ease-in-out infinite;
    }

    /* ==========================================================================
       CURSOR-REACTIVE SUBJECT SPOTLIGHT & 3D MAGNETIC TILT COMPONENT
       ========================================================================== */
    .subject-selector-dropdown {
      animation: dropdownReveal 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transform-origin: top center;
    }

    @keyframes dropdownReveal {
      from {
        opacity: 0;
        transform: translateY(-8px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .cursor-spotlight-card {
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
      will-change: transform, box-shadow;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                  box-shadow 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                  background-color 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Dynamic Radial Glow beneath cursor */
    .cursor-spotlight-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: radial-gradient(
        220px circle at var(--spotlight-x, -999px) var(--spotlight-y, -999px),
        rgba(103, 232, 249, 0.16),
        transparent 70%
      );
      opacity: 0;
      transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1;
    }

    .cursor-spotlight-card:hover::before {
      opacity: 1;
    }

    /* Illuminated edge/border glow near pointer */
    .cursor-spotlight-card::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      pointer-events: none;
      padding: 1px;
      background: radial-gradient(
        240px circle at var(--spotlight-x, -999px) var(--spotlight-y, -999px),
        rgba(103, 232, 249, 0.45),
        transparent 65%
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 2;
    }

    .cursor-spotlight-card:hover::after {
      opacity: 1;
    }

    /* Staggered entrance animation for cards */
    @keyframes subjectCardEntrance {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .stagger-card {
      animation: subjectCardEntrance 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: calc(var(--item-idx, 0) * 22ms);
      will-change: transform, opacity;
    }

    /* Active click compression */
    .cursor-spotlight-card:active {
      transform: scale(0.98) !important;
      transition: transform 0.08s ease-out !important;
    }

    /* Accessibility: Respect prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      .cursor-spotlight-card {
        transform: none !important;
        transition: border-color 0.15s ease, background-color 0.15s ease !important;
      }
      .stagger-card,
      .subject-selector-dropdown {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      .cursor-spotlight-card::before,
      .cursor-spotlight-card::after {
        display: none !important;
      }
    }
  </style>
</head>

  <!-- Ambient Ice Refraction Canvas Script -->
  <script>
    (function initIceCanvas() {
      const canvas = document.getElementById('ice-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let width, height;
      let mouseX = 0, mouseY = 0;

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      window.addEventListener('pointermove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      const orbs = [
        { x: width * 0.2, y: height * 0.25, r: 280, color: 'rgba(103, 232, 249, 0.035)', speedX: 0.0006, speedY: 0.0008, phase: 0 },
        { x: width * 0.8, y: height * 0.35, r: 350, color: 'rgba(56, 189, 248, 0.03)', speedX: 0.0005, speedY: 0.0004, phase: 2 },
        { x: width * 0.5, y: height * 0.8, r: 420, color: 'rgba(34, 211, 238, 0.025)', speedX: 0.0007, speedY: 0.0006, phase: 4 }
      ];

      const particles = [];
      for (let i = 0; i < 40; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          size: Math.random() * 1.5 + 0.5,
          alpha: Math.random() * 0.4 + 0.1,
          vx: (Math.random() - 0.5) * 0.2,
          vy: -Math.random() * 0.25 - 0.05
        });
      }

      function draw(time) {
        ctx.clearRect(0, 0, width, height);

        orbs.forEach(orb => {
          const offsetX = Math.sin(time * orb.speedX + orb.phase) * 80 + (mouseX - width / 2) * 0.03;
          const offsetY = Math.cos(time * orb.speedY + orb.phase) * 60 + (mouseY - height / 2) * 0.03;
          
          const grad = ctx.createRadialGradient(
            orb.x + offsetX, orb.y + offsetY, 0,
            orb.x + offsetX, orb.y + offsetY, orb.r
          );
          grad.addColorStop(0, orb.color);
          grad.addColorStop(1, 'transparent');

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(orb.x + offsetX, orb.y + offsetY, orb.r, 0, Math.PI * 2);
          ctx.fill();
        });

        ctx.fillStyle = '#67E8F9';
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          if (p.y < 0) {
            p.y = height;
            p.x = Math.random() * width;
          }
          if (p.x < 0) p.x = width;
          if (p.x > width) p.x = 0;

          ctx.globalAlpha = p.alpha;
          ctx.fillRect(p.x, p.y, p.size, p.size);
        });
        ctx.globalAlpha = 1.0;

        requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);
    })();

                            <span>DISQUALIFIED (LANGUAGE &lt; 30%)</span>

                          <p className="text-xs text-slate-300 font-sans leading-relaxed">
                            University of Delhi requires candidate to score minimum 30% (75/250) in Language paper for Science programs.
                          </p>
                        </div>
                      ` : !hasSeatAllocated ? html`
                        <div className="p-4 rounded-2xl bg-white/5 border border-white/10 text-center">
                          <div className="font-mono text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">
                            NO SEAT ALLOCATED IN THIS ROUND
                          </div>
                          <p className="text-xs text-slate-400 font-sans">
                            No candidate was allocated in DDUC under ${selectedCategory} quota for this specific round.
                          </p>
                        </div>
                      ` : delta >= 0 ? html`
                        <div className="p-4 rounded-2xl bg-status-green/10 border border-status-green/40 text-center">
                          <div className="inline-flex items-center gap-1.5 font-mono text-xs font-bold text-status-green uppercase tracking-wider mb-1">
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                            <span>QUALIFIED // ADMISSION LIKELY</span>
                          </div>
                          <p className="text-xs text-slate-200 font-sans leading-relaxed">
                            Your merit score exceeds the DDUC ${selectedRound === "round1" ? "Round 1" : selectedRound === "round2" ? "Round 2" : "Spot"} closing cutoff by <strong className="text-status-green">+${delta.toFixed(2)} marks</strong>. High probability of seat allotment!
                          </p>
                        </div>
                      ` : html`
                        <div className="p-4 rounded-2xl bg-status-red/10 border border-status-red/30 text-center">
                          <div className="inline-flex items-center gap-1.5 font-mono text-xs font-bold text-status-red uppercase tracking-wider mb-1">
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                            <span>AWAY FROM CUTOFF</span>
                          </div>
                          <p className="text-xs text-slate-300 font-sans leading-relaxed">
                            Your score is <strong className="text-status-red">${Math.abs(delta).toFixed(2)} marks</strong> below the closing threshold for this round. Consider subsequent rounds or related streams.
                          </p>
                        </div>
                      `}
                    </div>

                    <!-- Multi-Round Comparative Matrix -->
                    <div className="pt-4 border-t border-white/[0.08] mb-6">
                      <span className="font-mono text-[10px] text-slate-400 uppercase tracking-widest block mb-2.5">
                        // HISTORICAL DDUC CUTOFF MATRIX (${selectedCategory})
                      </span>
                      <div className="grid grid-cols-3 gap-2 text-center font-mono">
                        <div className="p-2 rounded-xl bg-void-900/60 border border-white/[0.05]">
                          <div className="text-[10px] text-slate-400">R1 Closing</div>
                          <div className="text-xs font-bold text-white mt-0.5">
                            ${(activeCourse?.round1 && activeCourse.round1[selectedCategory] != null) ? Number(activeCourse.round1[selectedCategory]).toFixed(1) : "—"}
                          </div>
                        </div>
                        <div className="p-2 rounded-xl bg-void-900/60 border border-white/[0.05]">
                          <div className="text-[10px] text-slate-400">R2 Closing</div>
                          <div className="text-xs font-bold text-white mt-0.5">
                            ${(activeCourse?.round2 && activeCourse.round2[selectedCategory] != null) ? Number(activeCourse.round2[selectedCategory]).toFixed(1) : "—"}
                          </div>
                        </div>
                        <div className="p-2 rounded-xl bg-void-900/60 border border-white/[0.05]">
                          <div className="text-[10px] text-slate-400">Spot Mop-Up</div>
                          <div className="text-xs font-bold text-white mt-0.5">
                            ${(activeCourse?.spot && activeCourse.spot[selectedCategory] != null) ? Number(activeCourse.spot[selectedCategory]).toFixed(1) : "—"}
                          </div>
                        </div>
                      </div>
                    </div>

                    <!-- Action Button -->
                    <div className="flex gap-2">
                      <button
                        onClick=${handleCopyReport}
                        className="flex-1 py-3 px-4 rounded-xl bg-white/10 hover:bg-white/15 border border-white/20 text-xs font-mono font-semibold text-white transition flex items-center justify-center gap-2 shadow-sm active:scale-95"
                      >
                        <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                        <span>${copiedToast ? "Copied Telemetry Report!" : "Copy Official Verdict"}</span>
                      </button>
                    </div>
                  </div>

                  <!-- Institutional Info Card -->
                  <div className="thaw-glass rounded-2xl p-5 border border-white/[0.06] text-xs font-mono text-slate-400 space-y-2">
                    <div className="text-ice-white font-semibold flex items-center gap-2">
                      <span className="w-1.5 h-1.5 rounded-full bg-ice-cyan"></span>
                      <span>DEEN DAYAL UPADHYAYA COLLEGE</span>
                    </div>
                    <p className="text-slate-400 font-sans text-[11px] leading-relaxed">
                      Sector-3, Dwarka, New Delhi. NAAC 'A' Grade Accredited • University of Delhi. Seat allocations governed by CSAS 2026 tie-breaking criteria.
                    </p>
                  </div>

                </div>

              </div>
            </main>

            <!-- FOOTER BAR -->
            <footer className="border-t border-white/[0.06] py-6 px-6 lg:px-12 bg-void-950 font-mono text-xs text-slate-500 flex flex-col sm:flex-row items-center justify-between gap-3">
              <div>
                © 2026 Deen Dayal Upadhyaya College • University of Delhi
              </div>
              <div className="flex items-center gap-4 text-[11px]">
                <span>NTA_CUET_COMPLIANT</span>
                <span>•</span>
                <a href="./index.html" className="text-ice-cyan hover:underline">
                  3D Architectural Campus
                </a>
              </div>
            </footer>

            <!-- DU RULES MODAL -->
            ${showInfoModal ? html`
              <div className="fixed inset-0 z-50 bg-void-950/80 backdrop-blur-xl flex items-center justify-center p-4">
                <div className="thaw-glass max-w-lg w-full rounded-3xl p-6 sm:p-8 border border-white/20 relative max-h-[85vh] overflow-y-auto">
                  <button
                    onClick=${() => setShowInfoModal(false)}
                    className="absolute top-6 right-6 p-2 rounded-full bg-white/5 hover:bg-white/10 text-slate-300"
                  >
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>
                  </button>

                  <div className="flex items-center gap-2 font-mono text-xs text-ice-cyan uppercase tracking-widest mb-2">
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    <span>// DU ADMISSION ARCHITECTURE</span>
                  </div>
                  <h3 className="text-2xl font-display font-bold text-white mb-4">
                    CUET DU CSAS Rules & Criteria
                  </h3>

                  <div className="space-y-4 font-sans text-xs text-slate-300 leading-relaxed">
                    <div className="p-3.5 rounded-xl bg-void-900 border border-white/10">
                      <h4 className="font-mono text-xs font-bold text-ice-cyan uppercase mb-1">1. Science 30% Qualifying Rule</h4>
                      <p>For B.Sc. (Hons) Physics, Chemistry, Electronics, Botany, Zoology, and Life Science, the language score is NOT added to the merit total. However, candidate MUST obtain at least 30% (75/250) in any one language from List A.</p>
                    </div>

                    <div className="p-3.5 rounded-xl bg-void-900 border border-white/10">
                      <h4 className="font-mono text-xs font-bold text-ice-cyan uppercase mb-1">2. 1,000 vs 750 Max Marks Scale</h4>
                      <p>Courses requiring 1 Language + 3 Domain subjects (e.g. B.Com Hons, B.Sc Computer Science, BA English) are calculated out of 1,000 marks (4 x 250). Courses requiring 3 domain subjects (e.g. B.Sc Physics, Chemistry) or BMS are scored out of 750 marks (3 x 250).</p>
                    </div>

                    <div className="p-3.5 rounded-xl bg-void-900 border border-white/10">
                      <h4 className="font-mono text-xs font-bold text-ice-cyan uppercase mb-1">3. Normalization & Tie-Breaking</h4>
                      <p>In case of identical CUET aggregates, DU CSAS applies tie-breakers based on Class 12th board marks, age, and alphabet priority.</p>
                    </div>
                  </div>

                  <div className="mt-6 pt-4 border-t border-white/10 flex justify-end">
                    <button
                      onClick=${() => setShowInfoModal(false)}
                      className="px-5 py-2 rounded-xl bg-white text-void-950 font-mono text-xs font-bold hover:bg-slate-200 transition"
                    >
                      Acknowledge
                    </button>
                  </div>
                </div>
              </div>
            ` : null}

          </div>
        `;
      }

      // Safe mount to #root using React 18 createRoot
      try {
        const rootContainer = document.getElementById('root');
        if (ReactDOM.createRoot) {
          const root = ReactDOM.createRoot(rootContainer);
          root.render(React.createElement(MainApp));
        } else {
          ReactDOM.render(React.createElement(MainApp), rootContainer);
        }
      } catch (err) {
        console.error("Mount error in CUET SPA:", err);
        const errBox = document.getElementById('error-fallback');
        const errMsg = document.getElementById('error-message');
        if (errBox && errMsg) {
          errMsg.textContent = err.stack || err.message;
          errBox.classList.remove('hidden');
        }
      }
    })();
  </script>
</body>
</html>
